// Target-native startup checks remain separate from ordinary game launches.

def bootstrapClasses = layout.buildDirectory.dir('native-bootstrap/classes')
def compileBootstrap = tasks.register('compileNativeBootstrap', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('src/bootstrapTest/java')
    source file('src/integrationTest/java/zone/moddev/mc/skysbuildingpiecesbop/probe/BasketChecks.java')
    source file('src/integrationTest/java/zone/moddev/mc/skysbuildingpiecesbop/probe/RetiredItemChecks.java')
    source file(new File(coreDirectory, 'src/integrationTest/java/zone/moddev/mc/skysbuildingpieces/probe/RecipeChecks.java'))
    source file(new File(coreDirectory, 'src/integrationTest/java/zone/moddev/mc/skysbuildingpieces/probe/RecipeBookChecks.java'))
    source file(new File(coreDirectory, 'src/integrationTest/java/zone/moddev/mc/skysbuildingpieces/probe/RecombinationChecks.java'))
    ['NativeLegacyChecks', 'DirtCoverageChecks', 'CoverageContributor'].each { name ->
        source file(new File(coreDirectory, 'src/integrationTest/java/zone/moddev/mc/skysbuildingpieces/probe/' + name + '.java'))
    }
    source fileTree(new File(coreDirectory, 'src/integrationTest/java/zone/moddev/mc/skysbuildingpieces/legacy'))
    ['ClientProbe', 'ClientStatus', 'ProbeProxy', 'RecipePreviewModels', 'PresentationChecks'].each { name ->
        source file(new File(coreDirectory, 'src/integrationTest/java/zone/moddev/mc/skysbuildingpieces/probe/' + name + '.java'))
    }
    ['BasketGuiClientChecks', 'BasketDisconnectClientChecks', 'BasketClientChecks'].each { name ->
        source file('src/integrationTest/java/zone/moddev/mc/skysbuildingpiecesbop/probe/' + name + '.java')
    }
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath, sourceSets.main.runtimeClasspath)
    destinationDirectory = bootstrapClasses
}
def bootstrapJar = tasks.register('nativeBootstrapJar', Jar) {
    dependsOn compileBootstrap
    archiveFileName = 'building-pieces-bop-native-checks.jar'
    destinationDirectory = layout.buildDirectory.dir('native-bootstrap')
    from bootstrapClasses
    from 'src/bootstrapTest/resources'
}
def packagedProbe = renamer.classes(bootstrapJar) {
    map.from minecraft.dependency.toSrgFile
    libraries.from tasks.named('jar', Jar).flatMap { it.archiveFile }
    libraries.from sourceSets.main.compileClasspath
    output = layout.buildDirectory.file('native-bootstrap/building-pieces-bop-native-checks-reobf.jar')
}
tasks.register('preparePackagedNativeProbe') { dependsOn packagedProbe }

tasks.register('verifyNativeServerLogPolicy', Exec) {
    group = 'verification'
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
            'tools/test_native_server_log.py'
}
tasks.named('check') { dependsOn tasks.named('verifyNativeServerLogPolicy') }

tasks.register('verifyNativeClientLogPolicy', Exec) {
    group = 'verification'
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
            'tools/test_native_client_log.py'
}
tasks.named('check') { dependsOn tasks.named('verifyNativeClientLogPolicy') }
def forwardFixture = providers.gradleProperty('bopForwardFixtureDir')
def forwardArchive = providers.gradleProperty('bopForwardFixtureArchive')
def hasForward = forwardFixture.isPresent() || forwardArchive.isPresent()
def directory = layout.buildDirectory.dir(hasForward
        ? 'native-forward-upgrade-run' : 'native-bootstrap-run')
def prepare = tasks.register('prepareNativeBootstrap') {
    dependsOn bootstrapJar
    dependsOn project.ext.bopDevelopmentTask
    doLast {
        File target = directory.get().asFile
        String expectedName = hasForward ? 'native-forward-upgrade-run' : 'native-bootstrap-run'
        if (target.canonicalFile != new File(buildDir, expectedName).canonicalFile) {
            throw new GradleException('Native checks must remain inside their build directory')
        }
        delete target
        if (forwardArchive.isPresent()) {
            if (forwardFixture.isPresent()) throw new GradleException('Choose one forward source')
            File archive = file(forwardArchive.get())
            File receipt = file(archive.path.replaceFirst(/\.zip$/, '.json'))
            def metadata = new groovy.json.JsonSlurper().parse(receipt)
            String checksum = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(archive.bytes).encodeHex().toString().toUpperCase()
            if (checksum != metadata.archive_sha256) throw new GradleException('The sealed source fixture changed')
            copy { from zipTree(archive); into new File(target, 'world') }
            copy { from receipt; into target; rename { 'forward-fixture.json' } }
        }
        if (forwardFixture.isPresent()) {
            File source = file(forwardFixture.get()).canonicalFile
            if (!new File(source, 'level.dat').isFile() || source.toPath().startsWith(target.toPath())) {
                throw new GradleException('Forward checks need a separate sealed source world')
            }
            copy { from source; into new File(target, 'world') }
            File manifest = new File(source.parentFile, 'source-fixture.json')
            if (!manifest.isFile()) throw new GradleException('Forward checks need the genuine source manifest')
            copy { from manifest; into target; rename { 'forward-fixture.json' } }
        }
        copy {
            from bootstrapJar.flatMap { it.archiveFile }
            from project.ext.bopDevelopmentJar
            from coreDevelopmentJar
            into new File(target, 'mods')
        }
        copy { from new File(coreDirectory, 'src/bootstrapTest/defaultconfigs'); into target }
        new File(target, 'eula.txt').text = 'eula=true\n'
        ['banned-players.json', 'banned-ips.json', 'ops.json', 'whitelist.json'].each {
            new File(target, it).text = '[]\n'
        }
        new File(target, 'server.properties').text = '''level-name=world
level-seed=4815162342
server-ip=127.0.0.1
server-port=0
online-mode=false
generate-structures=false
spawn-animals=false
spawn-monsters=false
max-tick-time=120000
'''
    }
}
tasks.register('nativeBootstrapTest', JavaExec) {
    dependsOn prepare
    workingDir directory
    project.ext.configureRecipeBookRun(delegate, 'runServer')
    doLast {
        File target = directory.get().asFile
        String log = new File(target, 'logs/latest.log').getText('UTF-8')
        if (!log.contains('BUILDING_PIECES_BOP_NATIVE_BOOTSTRAP_PASS') ||
                hasForward && !log.contains('BUILDING_PIECES_BOP_FORWARD_UPGRADE_PASS') ||
                !log.contains('Done (') || log.find(/\/(?:ERROR|FATAL)\]/) || log.contains('[STDERR') ||
                !fileTree(new File(target, 'crash-reports')).isEmpty()) {
            throw new GradleException('Native BOP startup did not complete cleanly')
        }
    }
}

tasks.register('nativeForwardReloadTest', JavaExec) {
    dependsOn bootstrapJar
    workingDir layout.buildDirectory.dir('native-forward-upgrade-run')
    project.ext.configureRecipeBookRun(delegate, 'runServer')
    doFirst {
        File target = workingDir
        if (!new File(target, 'forward-fixture.json').isFile()
                || !new File(target, 'world/level.dat').isFile()) {
            throw new GradleException('Run the copied forward fixture once before its reload check')
        }
        [bootstrapJar.get().archiveFile.get().asFile, coreDevelopmentJar, project.ext.bopDevelopmentJar].each { input ->
            File original = file(input)
            File installed = new File(target, 'mods/' + original.name)
            if (!installed.isFile() || !java.util.Arrays.equals(original.bytes, installed.bytes)) {
                throw new GradleException('The forward candidate changed before reload: ' + original.name)
            }
        }
    }
    doLast {
        String log = new File(workingDir, 'logs/latest.log').getText('UTF-8')
        if (!log.contains('BUILDING_PIECES_BOP_FORWARD_UPGRADE_PASS') || !log.contains('Done (')
                || log.find(/\/(?:ERROR|FATAL)\]/) || log.contains('[STDERR')
                || !fileTree(new File(workingDir, 'crash-reports')).isEmpty()) {
            throw new GradleException('The forward fixture did not reload cleanly')
        }
    }
}

def clientPhase = providers.gradleProperty('bopClientPhase').orElse('client-basket')
def clientDisconnect = clientPhase.get().startsWith('client-basket-disconnect')
if (!(clientPhase.get() in ['client-basket', 'client-basket-disconnect', 'client-basket-disconnect-reload'])) {
    throw new GradleException('Unknown native basket client phase: ' + clientPhase.get())
}
def clientDirectory = layout.buildDirectory.dir(clientDisconnect
        ? 'native-client-disconnect-run' : 'native-client-test-run')
def prepareClient = tasks.register('prepareNativeClientTest') {
    dependsOn bootstrapJar, project.ext.bopDevelopmentTask
    doLast {
        File target = clientDirectory.get().asFile
        if (target.canonicalFile != new File(buildDir, clientDisconnect
                ? 'native-client-disconnect-run' : 'native-client-test-run').canonicalFile) {
            throw new GradleException('Client checks must stay inside their build directory')
        }
        if (clientPhase.get().endsWith('-reload')) {
            if (!new File(target, 'basket-disconnect-pass.txt').isFile()) {
                throw new GradleException('Complete the open-window disconnect before checking its saved player')
            }
            [bootstrapJar.get().archiveFile.get().asFile, coreDevelopmentJar, project.ext.bopDevelopmentJar].each { input ->
                File original = file(input)
                File installed = new File(target, 'mods/' + original.name)
                if (!installed.isFile() || !java.util.Arrays.equals(original.bytes, installed.bytes)) {
                    throw new GradleException('The disconnect candidate changed before reload: ' + original.name)
                }
            }
            return
        }
        delete target
        copy {
            from bootstrapJar.flatMap { it.archiveFile }
            from project.ext.bopDevelopmentJar
            from coreDevelopmentJar
            into new File(target, 'mods')
        }
        copy { from new File(coreDirectory, 'src/bootstrapTest/defaultconfigs'); into target }
        ['banned-players.json', 'banned-ips.json', 'ops.json', 'whitelist.json'].each {
            new File(target, it).text = '[]\n'
        }
        new File(target, 'options.txt').text = 'lang:en_us\nfullscreen:false\nrenderDistance:2\n'
    }
}
def clientAssets = providers.gradleProperty('forgeClientAssets').orElse(
        new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/assets').absolutePath)
def clientNatives = providers.gradleProperty('forgeClientNatives').orElse(
        new File(gradle.gradleUserHomeDir,
                "caches/minecraftforge/forgegradle/slime-launcher/cache/net/minecraftforge/forge/${minecraft_version}-${forge_version}/natives").absolutePath)
def clientJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
tasks.register('nativeClientTest', Exec) {
    dependsOn prepareClient
    dependsOn {
        JavaExec run = tasks.getByName('runClient') as JavaExec
        run.taskDependencies.getDependencies(run)
    }
    doFirst {
        JavaExec run = tasks.getByName('runClient') as JavaExec
        File assets = file(clientAssets.get())
        File natives = file(clientNatives.get())
        [new File(assets, 'indexes/1.14.json'), natives].each {
            if (!it.exists()) throw new GradleException('Incomplete native client runtime: ' + it)
        }
        File classpathJar = layout.buildDirectory.file('native-bootstrap/client-classpath.jar').get().asFile
        java.util.jar.Manifest manifest = new java.util.jar.Manifest()
        manifest.mainAttributes.put(java.util.jar.Attributes.Name.MANIFEST_VERSION, '1.0')
        manifest.mainAttributes.put(java.util.jar.Attributes.Name.CLASS_PATH,
                run.classpath.files.collect { it.toURI().toASCIIString() }.join(' '))
        classpathJar.withOutputStream { new java.util.jar.JarOutputStream(it, manifest).close() }
        Map<String, Object> launchEnvironment = new LinkedHashMap<>(run.environment)
        launchEnvironment.putAll([
                target: 'fmluserdevclient', MCP_MAPPINGS: "${mapping_channel}_${mapping_version}",
                MCP_VERSION: mcp_version, FORGE_VERSION: forge_version, FORGE_GROUP: 'net.minecraftforge',
                MC_VERSION: minecraft_version, assetDirectory: assets.absolutePath, assetIndex: '1.14',
                nativesDirectory: natives.absolutePath,
                MOD_CLASSES: "${mod_id}%%${buildDir}/forge-run-mod-classes/main${File.pathSeparator}" +
                        "${mod_id}%%${buildDir}/forge-run-mod-classes/main"])
        workingDir clientDirectory
        environment launchEnvironment
        commandLine clientJava.get().executablePath.asFile.absolutePath, '-Xmx2g',
                '-Dskysbuildingpieces.integrationPhase=' + clientPhase.get(),
                '-cp', classpathJar.absolutePath, 'net.minecraftforge.userdev.LaunchTesting'
    }
    doLast {
        logger.lifecycle(providers.exec {
            commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
                    file('tools/native_client_log.py'), '--directory', clientDirectory.get().asFile,
                    '--phase', clientPhase.get()
        }.standardOutput.asText.get().trim())
        String log = new File(clientDirectory.get().asFile, 'logs/latest.log').getText('UTF-8')
        String marker = clientPhase.get() == 'client-basket' ? 'BOP_BASKET_GUI_NETWORK_PASS'
                : clientPhase.get().endsWith('-reload') ? 'BOP_BASKET_DISCONNECT_RELOAD_PASS'
                : 'BOP_BASKET_DISCONNECT_PASS'
        if (!log.contains(marker) || !log.contains('SKY_RECIPE_BOOK_PASS')
                || !log.contains('BOP_BASKET_CLIENT_PASS')) {
            throw new GradleException('Basket GUI or recipe-book client checks did not finish')
        }
    }
}
