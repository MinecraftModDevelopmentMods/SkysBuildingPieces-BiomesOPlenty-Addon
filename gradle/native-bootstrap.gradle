// Target-native startup checks remain separate from ordinary game launches.

def auditServerLogs = { File directory, String phase ->
    def audit = providers.exec {
        commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
                file('tools/native_client_log.py'), '--server', '--directory', directory,
                '--phase', phase
        ignoreExitValue = true
    }
    logger.lifecycle(audit.standardOutput.asText.get().trim())
    String failure = audit.standardError.asText.get().trim()
    if (!failure.isEmpty()) logger.lifecycle(failure)
    if (audit.result.get().exitValue != 0) {
        throw new GradleException('The complete native server log audit failed; see its diagnostic above')
    }
}

