tasks.register('nativeForwardReloadTest', JavaExec) {
    dependsOn bootstrapJar
    workingDir directory
    project.ext.configureRecipeBookRun(delegate, 'runServer')
    systemProperty 'skysbuildingpieces.bopDelayedBiomes',
            providers.gradleProperty('bopDelayBiomes').getOrElse('false')
    doFirst {
        File target = workingDir
        if (!new File(target, 'forward-fixture.json').isFile()
                || !new File(target, 'world/level.dat').isFile()) {
            throw new GradleException('Run the copied forward fixture once before its reload check')
        }
        [bootstrapJar.get().archiveFile.get().asFile, coreDevelopmentJar, project.ext.bopDevelopmentJar, project.ext.terraBlenderDevelopmentJar].each { input ->
            File original = file(input)
            File installed = new File(target, 'mods/' + original.name)
            if (!installed.isFile() || !java.util.Arrays.equals(original.bytes, installed.bytes)) {
                throw new GradleException('The forward candidate changed before reload: ' + original.name)
            }
        }
    }
    doLast {
        auditServerLogs(workingDir, 'forward-reload')
        String log = new File(workingDir, 'logs/latest.log').getText('UTF-8')
        if (!log.contains('BUILDING_PIECES_BOP_FORWARD_UPGRADE_PASS') || !log.contains('Done (')
                || !fileTree(new File(workingDir, 'crash-reports')).isEmpty()) {
            throw new GradleException('The forward fixture did not reload cleanly')
        }
    }
}

def clientPhase = providers.gradleProperty('bopClientPhase').orElse('client-basket')
def clientDisconnect = clientPhase.get().startsWith('client-basket-disconnect')
def clientReload = providers.gradleProperty('bopClientReload').getOrElse('false').toBoolean()
if (clientReload && clientDisconnect) throw new GradleException('Use the dedicated disconnect reload phase')
if (!(clientPhase.get() in ['client-basket', 'client-basket-disconnect', 'client-basket-disconnect-reload'])) {
    throw new GradleException('Unknown native basket client phase: ' + clientPhase.get())
}
def clientRunName = providers.gradleProperty('bopNativeClientRunName').getOrElse(clientDisconnect
        ? 'native-client-disconnect-run' : 'native-client-test-run')
if (!(clientRunName ==~ /native-[a-z0-9-]+/)) {
    throw new GradleException('Native client folders need a simple name under build')
}
def clientDirectory = layout.buildDirectory.dir(clientRunName)
def prepareClient = tasks.register('prepareNativeClientTest') {
    dependsOn bootstrapJar, project.ext.bopDevelopmentTask
    if (nativeCompanions) dependsOn verifyCompanions
    doLast {
        File target = clientDirectory.get().asFile
        if (target.canonicalFile != new File(buildDir, clientRunName).canonicalFile) {
            throw new GradleException('Client checks must stay inside their build directory')
        }
        if (clientReload || clientPhase.get().endsWith('-reload')) {
            File completed = new File(target, clientReload
                    ? 'saves/building-pieces-world/level.dat' : 'basket-disconnect-pass.txt')
            if (!completed.isFile()) {
                throw new GradleException('Complete the open-window disconnect before checking its saved player')
            }
            List<File> reloadInputs = [bootstrapJar.get().archiveFile.get().asFile, coreDevelopmentJar,
                    project.ext.bopDevelopmentJar, project.ext.terraBlenderDevelopmentJar]
            if (nativeCompanions) reloadInputs.addAll(companionJars)
            reloadInputs.each { input ->
                File original = file(input)
                File installed = new File(target, 'mods/' + original.name)
                if (!installed.isFile() || !java.util.Arrays.equals(original.bytes, installed.bytes)) {
                    throw new GradleException('The disconnect candidate changed before reload: ' + original.name)
                }
            }
            return
        }
        if (target.exists()) throw new GradleException('Preserve existing runtime evidence before another run: ' + target)
        copy {
            from bootstrapJar.flatMap { it.archiveFile }
            from project.ext.bopDevelopmentJar
            from project.ext.terraBlenderDevelopmentJar
            from coreDevelopmentJar
            into new File(target, 'mods')
        }
        if (nativeCompanions) {
            copy { from companionJars; into new File(target, 'mods') }
        }
        copy { from new File(coreDirectory, 'src/bootstrapTest/defaultconfigs'); into target }
        ['banned-players.json', 'banned-ips.json', 'ops.json', 'whitelist.json'].each {
            new File(target, it).text = '[]\n'
        }
        new File(target, 'options.txt').text = 'lang:en_us\nfullscreen:false\nrenderDistance:2\n'
    }
}
tasks.register('nativeClientTest', JavaExec) {
    dependsOn prepareClient
    workingDir clientDirectory
    systemProperty 'skysbuildingpieces.integrationPhase', clientPhase.get()
    project.ext.configureRecipeBookRun(delegate, 'runClient')
    doLast {
        logger.lifecycle(providers.exec {
            commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
                    file('tools/native_client_log.py'), '--directory', clientDirectory.get().asFile,
                    '--phase', clientPhase.get() + (clientReload ? '-reload' : '')
        }.standardOutput.asText.get().trim())
        String log = new File(clientDirectory.get().asFile, 'logs/latest.log').getText('UTF-8')
        String marker = clientPhase.get() == 'client-basket' ? 'BOP_BASKET_GUI_NETWORK_PASS'
                : clientPhase.get().endsWith('-reload') ? 'BOP_BASKET_DISCONNECT_RELOAD_PASS'
                : 'BOP_BASKET_DISCONNECT_PASS'
        if (!log.contains(marker) || !log.contains('SKY_RECIPE_BOOK_PASS')
                || !log.contains('BOP_BASKET_CLIENT_PASS')) {
            throw new GradleException('Basket GUI or recipe-book client checks did not finish')
        }
    }
}

