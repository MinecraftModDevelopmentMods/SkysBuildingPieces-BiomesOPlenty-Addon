// The combined verification profile uses exact optional jars, never production dependencies.
def nativeCompanions = providers.gradleProperty('bopNativeCompanions').getOrElse('false').toBoolean()
def companionLock = new Properties()
file('gradle/optional-runtime.properties').withInputStream { companionLock.load(it) }
def companionJars = ['grass', 'mineralogy', 'orespawn'].collect { name ->
    file(companionLock.getProperty(name + '.development.path'))
}
def verifyCompanions = tasks.register('verifyBopNativeCompanions') {
    doLast {
        ['grass', 'mineralogy', 'orespawn'].each { name ->
            ['', '.development'].each { kind ->
                File artifact = file(companionLock.getProperty(name + kind + '.path'))
                String expected = companionLock.getProperty(name + kind + '.sha256')
                if (!artifact.isFile() || java.security.MessageDigest.getInstance('SHA-256')
                        .digest(artifact.bytes).encodeHex().toString().toUpperCase(Locale.ROOT) != expected) {
                    throw new GradleException('The optional native reference is missing or changed: ' + artifact.name)
                }
            }
        }
    }
}

def forwardFixture = providers.gradleProperty('bopForwardFixtureDir')
def forwardArchive = providers.gradleProperty('bopForwardFixtureArchive')
def hasForward = forwardFixture.isPresent() || forwardArchive.isPresent()
def nativeRunName = providers.gradleProperty('bopNativeRunName').getOrElse(hasForward
        ? 'native-forward-upgrade-run' : 'native-bootstrap-run')
if (!(nativeRunName ==~ /native-[a-z0-9-]+/)) {
    throw new GradleException('Native runtime folders need a simple name under build')
}
def directory = layout.buildDirectory.dir(nativeRunName)
def prepare = tasks.register('prepareNativeBootstrap') {
    dependsOn bootstrapJar
    if (nativeCompanions) dependsOn verifyCompanions
    dependsOn project.ext.bopDevelopmentTask
    doLast {
        File target = directory.get().asFile
        String expectedName = nativeRunName
        if (target.canonicalFile != new File(buildDir, expectedName).canonicalFile) {
            throw new GradleException('Native checks must remain inside their build directory')
        }
        if (target.exists()) throw new GradleException('Preserve existing runtime evidence before another run: ' + target)
        if (forwardArchive.isPresent()) {
            if (forwardFixture.isPresent()) throw new GradleException('Choose one forward source')
            File archive = file(forwardArchive.get())
            File receipt = file(archive.path.replaceFirst(/\.zip$/, '.json'))
            def metadata = new groovy.json.JsonSlurper().parse(receipt)
            String checksum = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(archive.bytes).encodeHex().toString().toUpperCase()
            if (checksum != metadata.archive_sha256) throw new GradleException('The sealed source fixture changed')
            copy { from zipTree(archive); into new File(target, 'world') }
            copy { from receipt; into target; rename { 'forward-fixture.json' } }
            File doors = file(archive.path.replaceFirst(/\.zip$/, '.neighbours.json'))
            if (doors.isFile()) {
                copy { from doors; into target; rename { 'forward-neighbours.json' } }
            }
            File biomes = file(archive.path.replaceFirst(/\.zip$/, '.biomes.json'))
            if (biomes.isFile()) {
                copy { from biomes; into target; rename { 'forward-biomes.json' } }
            }
        }
        if (forwardFixture.isPresent()) {
            File source = file(forwardFixture.get()).canonicalFile
            if (!new File(source, 'level.dat').isFile() || source.toPath().startsWith(target.toPath())) {
                throw new GradleException('Forward checks need a separate sealed source world')
            }
            copy { from source; into new File(target, 'world') }
            File manifest = new File(source.parentFile, 'source-fixture.json')
            if (!manifest.isFile()) throw new GradleException('Forward checks need the genuine source manifest')
            copy { from manifest; into target; rename { 'forward-fixture.json' } }
        }
        copy {
            from bootstrapJar.flatMap { it.archiveFile }
            from project.ext.bopDevelopmentJar
            from project.ext.terraBlenderDevelopmentJar
            from coreDevelopmentJar
            into new File(target, 'mods')
        }
        if (nativeCompanions) {
            copy { from companionJars; into new File(target, 'mods') }
        }
        copy { from new File(coreDirectory, 'src/bootstrapTest/defaultconfigs'); into target }
        if (hasForward) {
            copy { from new File(target, 'world/level.dat'); into target; rename { 'source-level.dat' } }
        }
        new File(target, 'eula.txt').text = 'eula=true\n'
        ['banned-players.json', 'banned-ips.json', 'ops.json', 'whitelist.json'].each {
            new File(target, it).text = '[]\n'
        }
        new File(target, 'server.properties').text = '''level-name=world
level-seed=4815162342
server-ip=127.0.0.1
server-port=0
online-mode=false
generate-structures=false
spawn-animals=false
spawn-monsters=false
max-tick-time=120000
'''
    }
}
// This short gate records the actual target registry before upgrade assertions run.
tasks.register('nativeRegistryTest', JavaExec) {
    dependsOn prepare
    workingDir directory
    project.ext.configureRecipeBookRun(delegate, 'runServer')
    systemProperty 'skysbuildingpieces.bopRegistryOnly', 'true'
    doLast {
        auditServerLogs(directory.get().asFile, 'registry')
        String log = new File(directory.get().asFile, 'logs/latest.log').getText('UTF-8')
        if (!log.contains('BUILDING_PIECES_BOP_REGISTRY_ONLY_PASS') || !log.contains('Done (')
                || !fileTree(new File(directory.get().asFile, 'crash-reports')).isEmpty()) {
            throw new GradleException('Target BOP registry startup did not complete cleanly')
        }
    }
}

