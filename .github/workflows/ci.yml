name: Sky's Building Pieces BOP 1.10 CI

on:
  push:
    branches:
      - master-1.10.2
      - 'feature/**'
  pull_request:
    branches:
      - master-1.10.2

permissions:
  contents: read

concurrency:
  group: skysbuildingpiecesbop-1.10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Pin production Java
        run: echo "SBP_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6


      - name: Clean the add-on before installing its dependency
        run: |
          chmod +x ./gradlew
          ./gradlew clean --no-daemon

      - name: Read the pinned core source
        id: core
        run: |
          echo "repository=$(sed -n 's/^repository=//p' gradle/core-dependency.properties)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit=//p' gradle/core-dependency.properties)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.commit }}
          path: build/dependencies/core

      - name: Build the pinned development dependency
        run: |
          chmod +x build/dependencies/core/gradlew
          cd build/dependencies/core
          ./gradlew jar --no-daemon --stacktrace

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build, test, and audit release artifacts
        run: >-
          ./gradlew check build javadoc verifyReleaseArtifacts writeReleaseChecksums
          verifyEclipseProductionClasspath --no-daemon --stacktrace

      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysBuildingPieces-BOP-1.10.2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/SkysBuildingPieces-BiomesOPlenty-Addon-0.1.0.110021.jar
            build/libs/SkysBuildingPieces-BiomesOPlenty-Addon-0.1.0.110021-sources.jar
            build/libs/SkysBuildingPieces-BiomesOPlenty-Addon-0.1.0.110021-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.md

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysBuildingPieces-BOP-1.10.2-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/*-run/**/*.properties
            build/problems/**
