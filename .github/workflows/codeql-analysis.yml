name: CodeQL

on:
  push:
    branches:
      - master-1.10.2
      - 'feature/**'
  pull_request:
    branches:
      - master-1.10.2
  schedule:
    - cron: '47 7 * * 4'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Pin production Java
        run: echo "SBP_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin


      - name: Clean the add-on before installing its dependency
        run: |
          chmod +x ./gradlew
          ./gradlew clean --no-daemon

      - name: Read the pinned core source
        id: core
        run: |
          echo "repository=$(sed -n 's/^repository=//p' gradle/core-dependency.properties)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit=//p' gradle/core-dependency.properties)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.commit }}
          path: build/dependencies/core

      - name: Build the pinned development dependency
        run: |
          chmod +x build/dependencies/core/gradlew
          cd build/dependencies/core
          ./gradlew jar --no-daemon --stacktrace

      - name: Compile production code
        run: |
          chmod +x ./gradlew
          ./gradlew classes --rerun-tasks --no-daemon --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
