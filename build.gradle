def integrationTestClasses = layout.buildDirectory.dir('integration-test-mod/classes')

// Released BOP classes use SRG names. Development Minecraft uses official names;
// keep this derived jar separate from the unchanged packaged dependency.
def developmentBopMappings = layout.buildDirectory.file('development-dependencies/srg-to-mcp.tsrg')
def reverseBopMappings = tasks.register('prepareBopDevelopmentMappings') {
    inputs.files(minecraft.dependency.toSrgFile)
    outputs.file(developmentBopMappings)
    doLast {
        File source = files(minecraft.dependency.toSrgFile).singleFile
        File target = developmentBopMappings.get().asFile
        target.parentFile.mkdirs()
        source.withInputStream { input ->
            InputStream mappings = source.name.endsWith('.gz') ? new java.util.zip.GZIPInputStream(input) : input
            IMappingFile.load(mappings).reverse().write(target.toPath(), IMappingFile.Format.TSRG, false)
        }
    }
}
def bopDevelopmentInput = tasks.register('bopDevelopmentInput', Jar) {
    dependsOn tasks.named('verifyCoreDependency')
    archiveFileName = 'biomesoplenty-development-input.jar'
    destinationDirectory = layout.buildDirectory.dir('development-dependencies')
    from(zipTree(bopJar)) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/accesstransformer.cfg'
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
}
def mappedBop = renamer.classes(bopDevelopmentInput) {
    map.from reverseBopMappings
    libraries.from sourceSets.main.compileClasspath
    // The available Minecraft library is already officially mapped. Resolve unique
    // SRG member names when source-namespace inheritance cannot be inspected.
    naiveSrg = true
    accessTransformers = false
    output = layout.buildDirectory.file('development-dependencies/biomesoplenty-official-classes.jar')
}
def bopDevelopmentArchive = tasks.register('bopDevelopmentJar', Jar) {
    dependsOn mappedBop
    archiveFileName = 'biomesoplenty-official.jar'
    destinationDirectory = layout.buildDirectory.dir('development-dependencies')
    from { zipTree(layout.buildDirectory.file('development-dependencies/biomesoplenty-official-classes.jar').get().asFile) }
    exclude 'META-INF/MANIFEST.MF'
    // Renamer 1.1.5 does not accept the native *() AT wildcard. Add these
    // already mapped rules after class remapping, retaining every rule.
    from(bopDevelopmentAccessRules) {
        into 'META-INF'
        rename { 'accesstransformer.cfg' }
    }
}
ext.bopDevelopmentJar = layout.buildDirectory.file('development-dependencies/biomesoplenty-official.jar')
