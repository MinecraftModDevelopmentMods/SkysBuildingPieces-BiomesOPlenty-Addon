def coreLock = new Properties()
file('gradle/core-dependency.properties').withInputStream { coreLock.load(it) }
def coreDirectory = file(providers.gradleProperty('buildingPiecesCoreDir').getOrElse('../../SkysBuildingPieces116/SkysBuildingPieces'))
def localCoreVersion = providers.gradleProperty('buildingPiecesCoreVersion')
if (localCoreVersion.isPresent() && (System.getenv('CI') == 'true' || !providers.gradleProperty('buildingPiecesCoreDir').isPresent()))
    throw new GradleException('The core-version override is local only and requires an explicit core directory; it is not permitted in CI.')
def effectiveCoreVersion = localCoreVersion.getOrElse(coreLock.version)
