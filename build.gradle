// Legacy dependencies carry their own SRG access rules. Apply BOP's original
// rules to the mapped development Minecraft jar; keep its release jar intact.
def bopDevelopmentAccessRules = file('.gradle/dependencies/biomesoplenty_at.cfg')
File bopJar = configurations.bopRelease.singleFile
if (MessageDigest.getInstance('SHA-256').digest(Files.readAllBytes(bopJar.toPath()))
        .encodeHex().toString().toUpperCase() != coreLock.bop_sha256)
    throw new GradleException('The BOP dependency does not match the qualified jar.')
def mappedMembers = new Properties()
file('gradle/bop-access-names.properties').withInputStream { mappedMembers.load(it) }
new ZipFile(bopJar).withCloseable { archive ->
    def entry = archive.getEntry('META-INF/accesstransformer.cfg')
    if (entry == null) throw new GradleException('BOP development access rules are missing.')
    bopDevelopmentAccessRules.parentFile.mkdirs()
    archive.getInputStream(entry).withCloseable { input ->
        String rules = input.getText('UTF-8').replaceAll(/\b(?:func|field)_\d+_[A-Za-z_]+\b/) { member ->
            if (!mappedMembers.containsKey(member)) throw new GradleException("Unmapped BOP access rule: ${member}")
            mappedMembers[member]
        }
        bopDevelopmentAccessRules.setText(rules, 'UTF-8')
    }
}
dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}") {
        accessTransformers.from(bopDevelopmentAccessRules)
    }
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
