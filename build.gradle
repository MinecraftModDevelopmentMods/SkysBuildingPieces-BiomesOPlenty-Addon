tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    dependsOn tasks.named('assemble'), tasks.named('verifyReleaseMetadata')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        releaseFiles.get().each { name ->
            File candidate = new File(libs, name)
            if (!candidate.isFile() || candidate.length() == 0) {
                throw new GradleException("Missing release artifact: ${candidate}")
            }
        }
        ZipFile zip = new ZipFile(new File(libs, releaseFiles.get()[0]))
        try {
            def metadata = new java.util.jar.Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            if (metadata.mainAttributes.getValue('Built-On-Java') != project.java_version.toString()) {
                throw new GradleException("The jar's Java label does not match its production target")
            }
            Set<String> names = zip.entries().collect { it.name } as Set<String>
            ['META-INF/mods.toml', 'META-INF/LICENSE', 'META-INF/LICENSE.spdx', 'META-INF/NOTICE',
             'zone/moddev/mc/skysbuildingpiecesbop/SkysBuildingPiecesBop.class', 'META-INF/BUILDINGBRICKS-MIT.txt',
             'META-INF/MINERALOGY-LGPL-3.0.txt', 'META-INF/MINERALOGY-GPL-3.0.txt',
             'assets/skysbuildingpiecesbop/blockstates/retired_rocks.json',
             'assets/skysbuildingpiecesbop/blockstates/stone_formations.json',
             'assets/skysbuildingpiecesbop/blockstates/jelled_poison.json',
             'zone/moddev/mc/skysbuildingpiecesbop/RetiredDecorations.class',
             'zone/moddev/mc/skysbuildingpiecesbop/basket/BasketItem.class',
             'data/skysbuildingpiecesbop/recipes/flower_basket.json',
             'data/skysbuildingpiecesbop/loot_tables/blocks/jelled_poison.json',
             'assets/skysbuildingpiecesbop/catalogue/legacy_world_states.json',
             'assets/skysbuildingpiecesbop/catalogue/legacy_biomes.json',
             'assets/skysbuildingpiecesbop/catalogue/legacy_items.json',
             'assets/skysbuildingpiecesbop/models/item/flower_basket.json',
             'assets/skysbuildingpiecesbop/textures/item/flower_basket_empty.png',
             'assets/skysbuildingpiecesbop/textures/item/flower_basket_full.png'].each { required ->
                if (!names.contains(required)) throw new GradleException("Release jar is missing ${required}")
            }
            ['gabbro', 'limestone', 'limestone_smooth', 'shale', 'shale_smooth',
             'siltstone', 'siltstone_smooth'].each { rock ->
                String texture = "assets/skysbuildingpiecesbop/textures/block/retired_${rock}.png"
                if (!names.contains(texture)) throw new GradleException("Release jar is missing ${texture}")
                if (!Arrays.equals(zip.getInputStream(zip.getEntry(texture)).bytes,
                        Files.readAllBytes(file("src/main/resources/${texture}").toPath()))) {
                    throw new GradleException("Release jar changed ${texture}")
                }
            }
            Set<String> forbidden = names.findAll { entry ->
                String lower = entry.toLowerCase(Locale.ROOT)
                lower.tokenize('/').any { segment -> segment in ['agents.md', 'agent.md', 'agent-notes', 'agent_notes'] } ||
                        lower.contains('.codex') || lower.contains('.claude') ||
                        lower.contains('/test/') || lower.contains('gametest') ||
                        lower.startsWith('assets/skysbuildingpiecesbop/recipes/') ||
                        lower.startsWith('assets/skysbuildingpiecesbop/advancements/') ||
                        lower.startsWith('assets/skysbuildingpiecesbop/textures/blocks/') ||
                        lower.startsWith('assets/skysbuildingpiecesbop/textures/items/') ||
                        lower.startsWith('assets/skysbuildingpiecesbop/lang/') && lower.endsWith('.lang') ||
                        lower.startsWith('d' + ':' + '/') ||
                        lower.startsWith('c' + ':' + '/users/')
            }
            if (!forbidden.isEmpty()) throw new GradleException("Forbidden release entries: ${forbidden}")

            String windowsPathPrefix = ':' + ((char) 92)
            List<String> forbiddenContent = [
                    'c' + windowsPathPrefix + 'users' + ((char) 92),
                    'd' + windowsPathPrefix + 'skysbuildingpieces',
                    '/' + 'home' + '/' + 'runner' + '/',
                    'agent-notes', 'agent_notes', '.codex', '.claude', '.cursor'
            ]
            zip.entries().each { entry ->
                if (!entry.directory) {
                    byte[] auditBytes = zip.getInputStream(entry).bytes
                    if (entry.name.endsWith('.class') &&
                            (((auditBytes[6] & 255) << 8) | (auditBytes[7] & 255)) != 61) {
                        throw new GradleException("Non-Java-16 production class: ${entry.name}")
                    }
                    String content = new String(zip.getInputStream(entry).bytes,
                            StandardCharsets.ISO_8859_1).toLowerCase(Locale.ROOT)
                    String match = forbiddenContent.find { content.contains(it) }
                    if (match != null) {
                        throw new GradleException(
                                "Release entry ${entry.name} contains forbidden local context: ${match}")
                    }
                    if (content.find(/ghp_[a-z0-9]{30,}|github_pat_[a-z0-9_]{40,}|akia[a-z0-9]{16}/)) {
                        throw new GradleException("Possible credential in ${entry.name}")
                    }
                }
            }
        } finally {
            zip.close()
        }

        List<String> localeFiles = [
                'de_at.json', 'de_au.json', 'de_de.json',
                'en_ca.json', 'en_en.json', 'en_gb.json', 'en_pt.json', 'en_us.json',
                'es_es.json', 'es_mx.json', 'fr_ca.json', 'fr_fr.json',
                'ja_jp.json', 'ko_kr.json', 'pt_br.json', 'pt_pt.json',
                'ru_ru.json', 'zh_cn.json'
        ]
        releaseFiles.get()[0..1].each { artifactName ->
            ZipFile localizedZip = new ZipFile(new File(libs, artifactName))
            try {
                localeFiles.each { localeName ->
                    String entryName = "assets/skysbuildingpiecesbop/lang/${localeName}"
                    def entry = localizedZip.getEntry(entryName)
                    if (entry == null) {
                        throw new GradleException("${artifactName} is missing ${entryName}")
                    }
                    File source = file("src/main/resources/${entryName}")
                    byte[] sourceBytes = Files.readAllBytes(source.toPath())
                    byte[] archiveBytes = localizedZip.getInputStream(entry).bytes
                    if (!Arrays.equals(sourceBytes, archiveBytes)) {
                        throw new GradleException(
                                "${artifactName} changed the UTF-8 bytes of ${entryName}")
                    }
                }
            } finally {
                localizedZip.close()
            }
        }
        // Sources and Javadocs are release artifacts too: audit their contents,
        // not only the runnable jar.
        releaseFiles.get()[1..2].each { artifactName ->
            new ZipFile(new File(libs, artifactName)).withCloseable { archive ->
                archive.entries().each { entry ->
                    String lower = entry.name.toLowerCase(Locale.ROOT)
                    if (lower.contains('agent-notes') || lower.contains('.codex') || lower.contains('.claude') ||
                            lower.contains('/probe/') || lower.contains('/test/') || lower.endsWith('agents.md'))
                        throw new GradleException("Forbidden auxiliary archive entry: ${entry.name}")
                    if (!entry.directory) {
                        String content = new String(archive.getInputStream(entry).bytes, StandardCharsets.ISO_8859_1).toLowerCase(Locale.ROOT)
                        if (archiveTextSuffixes.any { lower.endsWith(it) } && content.indexOf('\r') >= 0)
                            throw new GradleException("Non-portable archive line endings in ${artifactName}: ${entry.name}")
                        if (content.find(/[a-z]:[\\\\\/]users[\\\\\/]|d:[\\\\\/]skysgrassslabs|ghp_[a-z0-9]{30,}|github_pat_[a-z0-9_]{40,}/))
                            throw new GradleException("Local path or credential in ${artifactName}: ${entry.name}")
                    }
                }
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def output = layout.buildDirectory.file('release/SHA256SUMS')
    inputs.files(releaseFiles.map { names -> names.collect { layout.buildDirectory.file("libs/${it}") } })
    outputs.file(output)
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        File checksumFile = output.get().asFile
        checksumFile.parentFile.mkdirs()
        checksumFile.setText(releaseFiles.get().collect { name ->
            File candidate = new File(libs, name)
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n', 'UTF-8')
    }
}

