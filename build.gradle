            File target = new File(mods, artifact.name)
            if (target.isFile() && sha256Of(target) != sha256Of(artifact)) {
                throw new GradleException("Existing run dependency has changed: ${target.name}")
            }
        }
        project.copy { from(required); into(mods) }
    }
}
