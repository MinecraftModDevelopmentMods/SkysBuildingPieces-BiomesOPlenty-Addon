def originalBopManifest = new ZipFile(bopJar).withCloseable { archive ->
    new java.util.jar.Manifest(archive.getInputStream(archive.getEntry('META-INF/MANIFEST.MF')))
            .mainAttributes.collectEntries { key, value -> [(key.toString()): value.toString()] }
}
def mappedMembers = new Properties()
file('gradle/bop-access-names.properties').withInputStream { mappedMembers.load(it) }
new ZipFile(bopJar).withCloseable { archive ->
    def entry = archive.getEntry('META-INF/accesstransformer.cfg')
    if (entry == null) throw new GradleException('BOP development access rules are missing.')
    bopDevelopmentAccessRules.parentFile.mkdirs()
    archive.getInputStream(entry).withCloseable { input ->
        String rules = input.getText('UTF-8').replaceAll(/\b[fm]_\d+_\b/) { member ->
            if (!mappedMembers.containsKey(member)) throw new GradleException("Unmapped BOP access rule: ${member}")
            mappedMembers[member]
        }
        bopDevelopmentAccessRules.setText(rules, 'UTF-8')
    }
}
