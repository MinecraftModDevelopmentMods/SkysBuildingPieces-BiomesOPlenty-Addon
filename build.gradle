        File runDirectory = integrationRunDirectory.get().asFile
        if (runDirectory.canonicalFile != new File(buildDir, integrationRunName).canonicalFile
                || runDirectory.exists()) {
            throw new GradleException('The integration checks require a new directory under build: ' + runDirectory)
        }
