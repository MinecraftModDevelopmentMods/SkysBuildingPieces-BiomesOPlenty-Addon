        project.copy {
            from 'src/bootstrapTest/defaultconfigs'
            into runDirectory
        }
        // ModLauncher 4's hierarchy cache uses unsynchronised maps during construction. The dense development
        // probe hit that race before BOP's subscriber loaded. Serialize this harness; packaged checks retain defaults.
        new File(runDirectory, 'config/fml.toml').setText('''versionCheck=true
