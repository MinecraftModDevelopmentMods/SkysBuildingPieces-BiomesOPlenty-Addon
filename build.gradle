tasks.register('verifyCoreDependency') {
    doLast {
        if (!coreDevelopmentJar.isFile()) throw new GradleException('Build the pinned core jar first; see the contributor build instructions.')
        def actualCoreProperties = new Properties()
        new File(coreDirectory, 'gradle.properties').withInputStream { actualCoreProperties.load(it) }
        if (actualCoreProperties.mod_version != effectiveCoreVersion)
            throw new GradleException('The selected core jar version does not match its source checkout.')
        if (!localCoreVersion.isPresent()) {
            def git = new ProcessBuilder('git', '-C', coreDirectory.path, 'rev-parse', 'HEAD').start()
            String actual = git.inputStream.getText('UTF-8').trim()
            if (git.waitFor() != 0 || actual != coreLock.commit)
                throw new GradleException('The core checkout does not match its pinned source commit.')
            def status = new ProcessBuilder('git', '-C', coreDirectory.path,
                    'status', '--porcelain', '--untracked-files=no').start()
            String pending = status.inputStream.getText('UTF-8').trim()
            if (status.waitFor() != 0 || pending) {
                throw new GradleException('The pinned core checkout has uncommitted changes.')
            }
            [
                (coreDevelopmentJar): coreLock.getProperty('development.sha256'),
                (new File(coreDirectory, "build/libs/SkysBuildingPieces-${effectiveCoreVersion}.jar")): coreLock.sha256
            ].each { artifact, expected ->
                if (!artifact.isFile() || !expected || MessageDigest.getInstance('SHA-256')
                        .digest(artifact.bytes).encodeHex().toString().toUpperCase() != expected) {
                    throw new GradleException('The pinned core artifact changed: ' + artifact.name)
                }
            }
        }
        File dependency = configurations.bopRelease.singleFile
        String hash = MessageDigest.getInstance('SHA-256').digest(Files.readAllBytes(dependency.toPath())).encodeHex().toString().toUpperCase()
        if (hash != coreLock.bop_sha256) throw new GradleException('The BOP dependency does not match the qualified jar.')
    }
}
tasks.withType(JavaCompile).configureEach { dependsOn 'verifyCoreDependency' }

